const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function __unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT)));
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const b=document.getElementById("go"),m=document.getElementById("msg");
  b.disabled=true;b.textContent="Opening…";m.textContent="";
  const pw=document.getElementById("pw").value;
  try{await __unlock(pw);try{sessionStorage.setItem("oseir-pw",pw)}catch(_){}}
  catch(_){m.textContent="Wrong password. Please try again.";b.disabled=false;b.textContent="Open presentation";}
});
try{const s=sessionStorage.getItem("oseir-pw");if(s)__unlock(s).catch(()=>{});}catch(_){}
})();
